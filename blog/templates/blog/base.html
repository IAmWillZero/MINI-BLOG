{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Am-Will - Blog de Williams</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="min-h-screen bg-background">
        <header class="border-b border-border">
            <div class="container mx-auto px-6 py-4">
                <nav class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.031 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                        <h1 class="text-2xl font-bold text-foreground">I-Am-Will</h1>
                    </div>
                    <div class="hidden md:flex items-center space-x-8">
                        <a href="#about" class="text-muted-foreground hover:text-foreground transition-colors">Acerca de</a>
                        <a href="#articles" class="text-muted-foreground hover:text-foreground transition-colors">Artículos</a>
                        <a href="#resources" class="text-muted-foreground hover:text-foreground transition-colors">Recursos</a>
                        <a href="#contact" class="text-muted-foreground hover:text-foreground transition-colors">Contacto</a>
                    </div>
                </nav>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer class="border-t border-border py-8 px-6">
            <div class="container mx-auto max-w-6xl">
                <div class="flex flex-col md:flex-row justify-between items-center">
                    <div class="flex items-center space-x-2 mb-4 md:mb-0">
                        <svg class="h-6 w-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.031 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                        <span class="font-semibold">I-Am-Will</span>
                    </div>
                    <p class="text-sm text-muted-foreground">
                        © 2025 I-Am-Will. Todos los derechos reservados. Blog personal de Williams.
                    </p>
                </div>
            </div>
        </footer>
    </div>
    <script>
        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
