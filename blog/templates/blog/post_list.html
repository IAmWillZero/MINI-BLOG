{% extends 'blog/base.html' %}

{% block content %}
<h2>Publicaciones</h2>
<div class="posts-grid">
{% for post in posts %}
<div class="post-card">
    <h3><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h3>
    {% if post.excerpt %}
    <p class="excerpt">{{ post.excerpt }}</p>
    {% else %}
    <p class="excerpt">{{ post.content|truncatewords:20 }}</p>
    {% endif %}
    <small>{{ post.created_at|date:"d M Y" }}</small>
    <div class="actions">
        <a href="{% url 'post_edit' post.pk %}">Editar</a> |
        <a href="{% url 'post_delete' post.pk %}" class="delete">Eliminar</a>
    </div>
</div>
{% endfor %}
</div>
{% endblock %}
