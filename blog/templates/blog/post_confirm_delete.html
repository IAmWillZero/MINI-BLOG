{% extends 'blog/base.html' %}

{% block content %}
<h2>Eliminar Publicación</h2>
<p>¿Estás seguro de que quieres eliminar la publicación "<strong>{{ post.title }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'post_list' %}">Cancelar</a>
</form>
{% endblock %}
